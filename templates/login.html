{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<h1>Inloggen</h1>
<form method="post">
    <label>E-mail</label>
    <input type="email" name="email" required>
    <label>Wachtwoord</label>
    <input type="password" name="password" required>
    <button type="submit">Inloggen</button>
</form>
{% endblock %}
